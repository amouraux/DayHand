			name = "Stamp build number";
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Stamp the build number with the number of commits in this repository.\n#\n# App Store Connect refuses a build number it has already seen, and bumping one\n# by hand is remembered until the day it is not. The commit count only ever\n# grows, needs no edit to any file, and ties an uploaded build to an exact\n# commit: `git rev-list --count HEAD` on any revision tells you which.\n#\n# Only the built app is stamped, never the source, so this leaves no diff.\nplist=\"${TARGET_BUILD_DIR}/${INFOPLIST_PATH}\"\n[ -f \"$plist\" ] || exit 0\n\ncount=$(cd \"${SRCROOT}\" && git rev-list --count HEAD 2>&1) || { echo \"warning: git failed: $count\"; exit 0; }\n[ -n \"$count\" ] || exit 0\n\n/usr/libexec/PlistBuddy -c \"Set :CFBundleVersion $count\" \"$plist\"\necho \"note: build number set to $count (commits in this repository)\"\n";
		};
